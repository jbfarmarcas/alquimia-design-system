name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apenas simular a publicação (npm publish --dry-run)"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # necessário para o Trusted Publishing (OIDC) e provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versão vem do campo "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing exige npm >= 11.5.1 (Node 22 vem com npm 10)
      - name: Atualizar npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar versão x tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::A tag ($TAG_VERSION) difere da versão do package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Validar que a versão ainda não foi publicada
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION já existe no npm. Incremente a versão."
            exit 1
          fi

      - name: Validar referência da skill
        run: pnpm skill:check

      - name: Build de validação (playground)
        run: pnpm build

      - name: Conteúdo do pacote
        run: npm pack --dry-run

      - name: Definir dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # prerelease (ex.: 1.0.0-beta.1) vai para "next"; estável vai para "latest"
          if [[ "$VERSION" == *-* ]]; then echo "name=next" >> "$GITHUB_OUTPUT"; else echo "name=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Publicar (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --tag ${{ steps.tag.outputs.name }} --dry-run --ignore-scripts

      - name: Publicar no npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --access public --provenance --tag ${{ steps.tag.outputs.name }} --ignore-scripts
